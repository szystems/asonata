version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: app
    image: "ghcr.io/szystems/asonata:${APP_VERSION:-latest}"
    restart: unless-stopped
    environment:
      - APP_NAME=Asonata
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://asonataxela.com
      - APP_LOCALE=es
      - APP_TIMEZONE=America/Guatemala
      - FILESYSTEM_DRIVER=local
      - SESSION_DOMAIN=.asonataxela.com
      - LOG_LEVEL=error
      - APP_KEY
      - SECURITY_CRON_TOKEN
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=dbasonatanuevo
      - DB_USERNAME=szasonata
      - DB_PASSWORD=0XGiSjLZ3fE2t1CAxgC1UDOHIHigRLYS
      - MAIL_HOST=smtp.ipage.com
      - MAIL_PORT=465
      - MAIL_ENCRYPTION=ssl
      - MAIL_FROM_ADDRESS=oszarata@szystems.com
      - MAIL_FROM_NAME=Asonata
      - MAIL_USERNAME
      - MAIL_PASSWORD
    volumes:
      - storage_private:/app/storage/app
      - public_assets:/app/public/assets
    depends_on:
      - mysql
    networks:
      - coolify

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - storage_private:/app/storage/app:ro
      - public_assets:/app/public/assets:ro
    depends_on:
      - app
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.asonata-http.entrypoints=http"
      - "traefik.http.routers.asonata-http.rule=Host(`asonataxela.com`) || Host(`www.asonataxela.com`)"
      - "traefik.http.routers.asonata-http.middlewares=asonata-https-redirect"
      - "traefik.http.routers.asonata-https.entrypoints=https"
      - "traefik.http.routers.asonata-https.rule=Host(`asonataxela.com`) || Host(`www.asonataxela.com`)"
      - "traefik.http.routers.asonata-https.tls=true"
      - "traefik.http.routers.asonata-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.asonata-https.service=asonata-svc"
      - "traefik.http.services.asonata-svc.loadbalancer.server.port=80"
      - "traefik.http.middlewares.asonata-https-redirect.redirectscheme.scheme=https"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: app
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      - APP_NAME=Asonata
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://asonataxela.com
      - APP_LOCALE=es
      - APP_TIMEZONE=America/Guatemala
      - FILESYSTEM_DRIVER=local
      - SESSION_DOMAIN=.asonataxela.com
      - APP_KEY
      - SECURITY_CRON_TOKEN
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=dbasonatanuevo
      - DB_USERNAME=szasonata
      - DB_PASSWORD=0XGiSjLZ3fE2t1CAxgC1UDOHIHigRLYS
      - MAIL_HOST=smtp.ipage.com
      - MAIL_PORT=465
      - MAIL_ENCRYPTION=ssl
      - MAIL_FROM_ADDRESS=oszarata@szystems.com
      - MAIL_FROM_NAME=Asonata
      - MAIL_USERNAME
      - MAIL_PASSWORD
    volumes:
      - storage_private:/app/storage/app
    depends_on:
      - mysql
    networks:
      - coolify

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=YqpHpRwb9lbmeaCtbVLAQQIwYPqtL7
      - MYSQL_DATABASE=dbasonatanuevo
      - MYSQL_USER=szasonata
      - MYSQL_PASSWORD=0XGiSjLZ3fE2t1CAxgC1UDOHIHigRLYS
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - coolify
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"

volumes:
  storage_private:
  public_assets:
  mysql_data:

networks:
  coolify:
    external: true