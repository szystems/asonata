server {
    listen 80;
    server_name asonataxela.com www.asonataxela.com;
    root /app/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Resolver dinámico: evita que nginx cachee el IP de app:9000 en startup.
        # Crítico en Docker Compose: sin esto, si el contenedor PHP se recrea,
        # nginx queda apuntando al IP viejo hasta que se reinicie.
        # También previene cross-serving si múltiples apps comparten la red coolify.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream_php "app:9000";
        fastcgi_pass $upstream_php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}