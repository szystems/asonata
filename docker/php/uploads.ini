; Límites de subida para producción (VPS + Coolify).
; El formulario de inscripción de atleta sube hasta 5 archivos
; (foto del atleta + foto/PDF responsable + carné de vacunas + certificado
; de nacimiento + contrato firmado), cada uno validado a max:3000 (≈3 MB).
; Los defaults de PHP (upload_max_filesize=2M, post_max_size=8M) hacían fallar
; la inscripción en el servidor aunque funcionara en local (php.ini de Laragon
; con límites más altos).

upload_max_filesize = 20M
post_max_size = 30M
max_file_uploads = 30
max_input_vars = 5000
memory_limit = 256M
max_execution_time = 120
