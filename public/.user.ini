; ==============================================================
; SOLUCIÓN ANTI-INYECCIÓN DE ANUNCIOS - iPage
; ==============================================================
; Archivo: .user.ini
; Ubicar en: /szystems/asonatanuevo/public/.user.ini
;
; Este archivo desactiva la inyección de scripts/anuncios que
; iPage agrega mediante auto_prepend_file y auto_append_file.
; Compatible con PHP CGI/FastCGI (que es lo que usa iPage).
; ==============================================================

; Desactivar archivos auto-prepend y auto-append (fuente de los anuncios)
auto_prepend_file = none
auto_append_file = none

; Configuración adicional de seguridad
expose_php = Off
